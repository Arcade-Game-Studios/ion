name: Publish Wiki

on:
  push:
    branches: [main]
    paths:
      - '.github/wiki/**'

permissions:
  contents: write

jobs:
  publish-wiki:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: Andrew-Chen-Wang/github-wiki-action@v4
        with:
          path: '.github/wiki'
