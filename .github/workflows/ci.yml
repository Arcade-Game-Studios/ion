name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev zlib1g-dev linux-libc-dev xvfb

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      # Windows is build-only for now: several tests write to /tmp.
      - name: Test
        if: runner.os == 'macOS'
        run: ctest --test-dir build -C Release --output-on-failure

      # Xvfb gives window_x11_test a display to drive.
      - name: Test (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a ctest --test-dir build -C Release --output-on-failure

  sanitize:
    name: Sanitizers (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libx11-dev zlib1g-dev linux-libc-dev xvfb

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DION_SANITIZE=ON -DION_BUILD_EXAMPLES=OFF

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: xvfb-run -a ctest --test-dir build --output-on-failure

  windows-cross:
    name: Windows (MinGW cross-build, tests under Wine)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-mingw-w64-x86-64 libz-mingw-w64-dev wine64

      - name: Configure
        run: cmake -S . -B build-win -DCMAKE_TOOLCHAIN_FILE=cmake/mingw-w64-x86_64.cmake -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build-win --parallel

      - name: Test
        env:
          WINEDEBUG: -all
        run: |
          WINE=$(command -v wine64 || echo /usr/lib/wine/wine64)
          for t in math_test core_test input_test render_test 2d_test model_test ecs_test \
                   audio_test asteroids_test image_test systems_test physics_test terminal_test; do
            echo "== $t"
            "$WINE" build-win/$t.exe
          done
